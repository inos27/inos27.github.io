<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web OBS - Live to YouTube</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: white;
    }
    .obs-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .video-preview {
      flex: 1;
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .controls {
      background-color: #333;
      padding: 10px;
      display: flex;
      justify-content: space-between;
    }
    button {
      padding: 10px 20px;
      background: #2196F3;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled {
      background: gray;
    }
  </style>
</head>
<body>
  <div class="obs-container">
    <div class="video-preview" id="preview">
      <video id="previewVideo" autoplay muted playsinline></video>
    </div>
    <div class="controls">
      <button id="startBtn">🎥 Start Camera</button>
      <button id="streamBtn" disabled>🔴 Go Live</button>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const streamBtn = document.getElementById("streamBtn");
    const previewVideo = document.getElementById("previewVideo");

    let stream;

    startBtn.onclick = async () => {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      previewVideo.srcObject = stream;
      streamBtn.disabled = false;
    };

    streamBtn.onclick = () => {
      alert("Streaming ke YouTube tidak bisa langsung dari browser!\nGunakan OBS atau server RTMP.");
    };
  </script>
</body>
</html>
